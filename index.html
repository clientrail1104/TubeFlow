<script>
async function loadClips(){

  clipsElement.innerHTML = "";

  for(let i=0;i<clips.length;i++){

    const clip = clips[i];

    await waitMetadata(clip.video);

    clip.duration = clip.video.duration;

    clip.thumbnail = captureFrame(
      clip.video,
      .1
    );

    if(i === 0){
      thumbnail = clip.thumbnail;
    }

    const div = document.createElement("div");

    div.className = "clip";

    div.innerHTML = `
      <div style="position:relative">

        <img src="${clip.thumbnail}">

        <button
          class="clip-download"
          title="Download video"
          aria-label="Download video"
        >
          ↓
        </button>

      </div>

      <div class="clip-info">

        <strong>
          ${escapeHTML(clip.file.name)}
        </strong>

        <span>
          ${formatTime(clip.duration)} • Ready
        </span>

      </div>
    `;

    clipsElement.appendChild(div);

    /*
      Download the individual ready video
    */

    const downloadButton =
      div.querySelector(".clip-download");

    downloadButton.addEventListener(
      "click",
      () => {

        const a =
          document.createElement("a");

        a.href = clip.video.src;

        a.download =
          clip.file.name;

        document.body.appendChild(a);

        a.click();

        a.remove();

      }
    );

  }

  currentClip = 0;

  playing = true;

  clips[0].video.currentTime = 0;

  clips[0].video.play().catch(()=>{});

  playButton.classList.add("active");

  render();
}
</script>
