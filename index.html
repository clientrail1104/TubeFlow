<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Studio - Video AI Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            gemini: {
              bg: '#0f1015',
              surface: '#181a20',
              border: '#2a2d36',
              accent: '#8ab4f8',
              purple: '#c58af9',
              pink: '#ff8bcb'
            }
          }
        }
      }
    }
  </script>
  <style>
    .gemini-gradient-text {
      background: linear-gradient(135deg, #a8c7fa 0%, #c58af9 50%, #ea80fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gemini-glass {
      background: rgba(24, 26, 32, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gemini-glow {
      box-shadow: 0 0 25px -5px rgba(138, 180, 248, 0.15);
    }
  </style>
</head>
<body class="bg-gemini-bg text-gray-200 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="gemini-glass sticky top-0 z-50 px-6 py-4 border-b border-gemini-border flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gemini-accent via-gemini-purple to-gemini-pink animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight text-white">Gemini<span class="gemini-gradient-text">Studio AI</span></h1>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-gemini-surface border border-gemini-border text-gray-400">v2.4 Auto-Enhance Engine</span>
  </header>

  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1 flex flex-col gap-8">
    
    <!-- Upload Section -->
    <section id="dropZone" class="gemini-glass rounded-3xl p-8 border-2 border-dashed border-gemini-border hover:border-gemini-accent transition-all duration-300 text-center cursor-pointer relative overflow-hidden group">
      <input type="file" id="videoInput" multiple accept="video/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
      
      <div class="flex flex-col items-center gap-3">
        <div class="w-16 h-16 rounded-2xl bg-gemini-surface border border-gemini-border flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
          <svg class="w-8 h-8 text-gemini-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-white">Drop your raw videos here, or <span class="gemini-gradient-text">browse</span></h2>
        <p class="text-xs text-gray-400">Supports MP4, MOV, WEBM. AI will generate HD thumbnails at 0.1s, metadata, and audio tracks.</p>
      </div>
    </section>

    <!-- Results Section -->
    <section id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- AI Processed Video Cards will render here -->
    </section>

  </main>

  <script>
    const videoInput = document.getElementById('videoInput');
    const resultsContainer = document.getElementById('resultsContainer');

    // Preset trending audio tracks & dynamic templates for simulated AI enrichment
    const audioTracks = [
      { name: '🔥 Cyberpunk Phonk (Trending)', url: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=phonk-113947.mp3' },
      { name: '✨ Lo-Fi Chill Beats (Royalty-Free)', url: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=lofi-study-112191.mp3' },
      { name: '🚀 Cinematic Synthwave (Copyright Free)', url: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=synthwave-80s-110045.mp3' }
    ];

    const metadataPool = [
      {
        title: "You Won't Believe What Happened Next! 😱 #ViralMoment",
        desc: "Watch until the end for the ultimate twist! This insane highlight is taking over TikTok and Reels today.",
        tags: "#Viral #Trending #MustWatch #FYP #Shorts #DailyHighlights"
      },
      {
        title: "10x Your Productivity With This Hidden Hack 💡",
        desc: "Stop wasting time! Here is the exact secret trick top creators use to scale their workflow effortlessly.",
        tags: "#LifeHacks #Productivity #TechTips #Mindset #Growth #AI"
      },
      {
        title: "The Ultimate Aesthetic POV You Need Today ✨",
        desc: "Unwind with these smooth, satisfying visuals paired with trending audio. Save this for inspiration!",
        tags: "#Aesthetic #POV #Satisfying #Chill #Vibes #Design"
      }
    ];

    videoInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(processVideo);
    });

    async function processVideo(file) {
      const videoId = 'vid_' + Math.random().toString(36).substr(2, 9);
      const videoUrl = URL.createObjectURL(file);
      
      // Randomly assign metadata and track for demonstration
      const meta = metadataPool[Math.floor(Math.random() * metadataPool.length)];
      const audio = audioTracks[Math.floor(Math.random() * audioTracks.length)];

      // 1. Create Placeholder Card
      const card = document.createElement('div');
      card.className = "gemini-glass rounded-2xl p-5 border border-gemini-border flex flex-col gap-4 gemini-glow relative overflow-hidden";
      card.id = videoId;
      card.innerHTML = `
        <div class="h-48 w-full bg-gemini-surface rounded-xl flex items-center justify-center animate-pulse">
          <span class="text-xs text-gemini-accent flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-gemini-accent" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Generating AI Metadata & Frame at 0.1s...
          </span>
        </div>
      `;
      resultsContainer.prepend(card);

      // 2. Extract Thumbnail at 0.1s using Canvas
      const thumbnailUrl = await extractFrameAt(videoUrl, 0.1);

      // 3. Populate Complete Gemini UI Card
      card.innerHTML = `
        <!-- Thumbnail Preview / Video Player Header -->
        <div class="relative group rounded-xl overflow-hidden bg-black aspect-video border border-gemini-border">
          <video id="player_${videoId}" class="w-full h-full object-cover hidden" controls poster="${thumbnailUrl}">
            <source src="${videoUrl}" type="${file.type}">
          </video>
          
          <div id="thumbContainer_${videoId}" class="relative w-full h-full">
            <img src="${thumbnailUrl}" class="w-full h-full object-cover" alt="AI Generated HD Thumbnail">
            <span class="absolute top-2 left-2 bg-gemini-bg/80 backdrop-blur-md text-gemini-accent text-[10px] font-bold px-2 py-0.5 rounded-full border border-gemini-accent/30">
              AI Thumbnail @ 0.1s
            </span>
            <button onclick="playVideo('${videoId}')" class="absolute inset-0 m-auto w-12 h-12 bg-gemini-accent/90 hover:bg-gemini-accent text-gemini-bg rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-110">
              <svg class="w-6 h-6 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>

          <!-- Download Icon Overlay -->
          <a href="${videoUrl}" download="gemini_edited_${file.name}" class="absolute bottom-2 right-2 p-2 bg-gemini-surface/90 hover:bg-gemini-accent hover:text-gemini-bg text-white rounded-lg backdrop-blur-md transition-all border border-gemini-border" title="Download Processed Video">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
          </a>
        </div>

        <!-- AI Generated Content -->
        <div class="flex flex-col gap-2 flex-1">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-medium text-gemini-purple tracking-wide uppercase">AI Generated Metadata</span>
            <span class="text-[10px] text-gray-500">${(file.size / (1024*1024)).toFixed(1)} MB</span>
          </div>

          <h3 class="text-sm font-bold text-white leading-snug hover:text-gemini-accent transition-colors">${meta.title}</h3>
          <p class="text-xs text-gray-400 line-clamp-2">${meta.desc}</p>
          <p class="text-xs font-semibold text-gemini-accent">${meta.tags}</p>
        </div>

        <!-- Royalty-Free Audio Integration -->
        <div class="pt-3 border-t border-gemini-border/60 flex flex-col gap-1.5">
          <label class="text-[10px] text-gray-400 flex items-center gap-1">
            <svg class="w-3 h-3 text-gemini-pink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
            </svg>
            Trending Audio Track (Royalty-Free)
          </label>
          <select class="bg-gemini-surface text-xs text-gray-200 border border-gemini-border rounded-lg p-2 focus:outline-none focus:border-gemini-accent">
            ${audioTracks.map(t => `<option value="${t.url}" ${t.name === audio.name ? 'selected' : ''}>${t.name}</option>`).join('')}
          </select>
        </div>
      `;
    }

    // Helper: Seek to 0.1s and render onto hidden canvas to create HD Image Data URL
    function extractFrameAt(videoUrl, timeInSeconds) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.src = videoUrl;
        video.crossOrigin = 'anonymous';
        video.currentTime = timeInSeconds;
        video.muted = true;

        video.addEventListener('seeked', () => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 360;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        });

        // Fallback for immediate load
        video.addEventListener('loadeddata', () => {
          if (video.currentTime !== timeInSeconds) {
            video.currentTime = timeInSeconds;
          }
        });
      });
    }

    // Toggle player
    function playVideo(id) {
      document.getElementById(`thumbContainer_${id}`).classList.add('hidden');
      const player = document.getElementById(`player_${id}`);
      player.classList.remove('hidden');
      player.play();
    }
  </script>
</body>
</html>
