<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Instant Video AI Studio</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #1e1f2b;
      --surface-hover: #2a2c3d;
      --border-color: #2f3245;
      --primary-accent: #7c5cff;
      --accent-gradient: linear-gradient(135deg, #7c5cff 0%, #ff6b8b 50%, #48cae4 100%);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem; }

    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      font-size: 2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }

    .dropzone-container {
      max-width: 1200px;
      margin: 0 auto 3rem;
    }

    .dropzone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      background: rgba(30, 31, 43, 0.5);
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary-accent);
      background: rgba(124, 92, 255, 0.05);
      transform: translateY(-2px);
    }

    .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .dropzone .icon { font-size: 2.5rem; color: var(--primary-accent); margin-bottom: 0.75rem; }
    .dropzone p { color: var(--text-muted); font-size: 0.95rem; }
    .dropzone p span { color: var(--text-main); font-weight: 600; text-decoration: underline; }

    .section-title {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .thumbnail-wrapper canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .thumbnail-wrapper:hover .play-badge { opacity: 1; }
    .play-badge span {
      font-size: 3rem;
      color: #fff;
      background: var(--accent-gradient);
      border-radius: 50%;
      padding: 0.25rem;
    }

    .audio-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 16, 21, 0.85);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #48cae4;
      border: 1px solid rgba(72, 202, 228, 0.3);
    }

    .card-content { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
    
    .ai-pill {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .video-title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
    .video-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    .hashtags { font-size: 0.8rem; color: var(--primary-accent); font-weight: 500; }

    /* Gemini Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 16, 21, 0.9);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 900px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .close-btn:hover { background: rgba(255,255,255,0.2); }

    .modal-player-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .modal-player-wrapper video { width: 100%; height: 100%; }

    .modal-info { padding: 1.5rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="material-symbols-outlined brand-icon">auto_awesome</span>
      <h1>Gemini Studio Engine</h1>
    </div>
  </header>

  <div class="dropzone-container">
    <div class="dropzone" id="dropzone">
      <span class="material-symbols-outlined icon">cloud_upload</span>
      <h3>Drag & Drop more video files here</h3>
      <p>or <span>browse computer</span> to run AI pre-editing pipeline</p>
      <input type="file" id="videoInput" accept="video/*" multiple />
    </div>
  </div>

  <div class="section-title">
    <span class="material-symbols-outlined" style="color:var(--primary-accent)">bolt</span>
    Instant Pre-edited Results
  </div>
  <main class="gallery-grid" id="galleryGrid"></main>

  <!-- Single Page Preview Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
      <button class="close-btn" id="closeModal">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="modal-player-wrapper">
        <video id="modalVideoPlayer" controls autoplay crossorigin="anonymous"></video>
      </div>
      <div class="modal-info">
        <h2 id="modalTitle" class="video-title" style="font-size: 1.3rem; margin-bottom: 0.5rem;"></h2>
        <p id="modalDesc" class="video-desc" style="margin-bottom: 0.5rem;"></p>
        <p id="modalTags" class="hashtags"></p>
      </div>
    </div>
  </div>

  <script>
    // Sample royalty-free public streams for instant viewing
    const instantPreMixDemos = [
      {
        videoSrc: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        title: "🔥 Mind-Blowing Hack That Changes Everything!",
        desc: "You won't believe how easily this works! Tried and tested viral concept that everyone is talking about right now.",
        tags: "#ViralHacks #Trending2026 #MustWatch #LifeHack",
        audio: "🎵 Phonk Remix (Royalty-Free)"
      },
      {
        videoSrc: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        title: "⚡ Secret Technique Revealed (Don't Skip)",
        desc: "Step-by-step breakdown of how to elevate your daily routine in seconds. Bookmark this before it gets taken down!",
        tags: "#ProTips #TechSecrets #TrendingNow #AlgorithmHack",
        audio: "🎵 Lo-Fi Chill Synth (Royalty-Free)"
      },
      {
        videoSrc: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        title: "✨ 3 Rules You Need To Know Right Now!",
        desc: "Master this visual trend and transform your content engine instantly. Guaranteed to pull higher reach.",
        tags: "#ContentCreator #GrowthHacks #GeminiAI #ViralReels",
        audio: "🎵 Deep Bass Pop Beat (Royalty-Free)"
      }
    ];

    const videoInput = document.getElementById('videoInput');
    const dropzone = document.getElementById('dropzone');
    const galleryGrid = document.getElementById('galleryGrid');
    
    // Modal Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalVideoPlayer = document.getElementById('modalVideoPlayer');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalTags = document.getElementById('modalTags');
    const closeModal = document.getElementById('closeModal');

    // Load Instant Results on Init
    window.addEventListener('DOMContentLoaded', () => {
      instantPreMixDemos.forEach(item => processVideoItem(item.videoSrc, item));
    });

    // File Upload Handlers
    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    videoInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      Array.from(files).forEach(file => {
        if (file.type.startsWith('video/')) {
          const fileUrl = URL.createObjectURL(file);
          const customMeta = instantPreMixDemos[Math.floor(Math.random() * instantPreMixDemos.length)];
          processVideoItem(fileUrl, customMeta);
        }
      });
    }

    function processVideoItem(videoSrc, meta) {
      const tempVideo = document.createElement('video');
      tempVideo.src = videoSrc;
      tempVideo.crossOrigin = "anonymous";
      tempVideo.muted = true;
      tempVideo.playsInline = true;

      // Extract 0.1s frame for instant thumbnail
      tempVideo.addEventListener('loadedmetadata', () => {
        tempVideo.currentTime = 0.1;
      });

      tempVideo.addEventListener('seeked', () => {
        const canvas = document.createElement('canvas');
        canvas.width = tempVideo.videoWidth || 640;
        canvas.height = tempVideo.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);

        createCardUI(canvas, videoSrc, meta);
      });
    }

    function createCardUI(canvas, videoSrc, meta) {
      const card = document.createElement('div');
      card.className = 'video-card';

      card.innerHTML = `
        <div class="thumbnail-wrapper">
          <div class="play-badge">
            <span class="material-symbols-outlined">play_arrow</span>
          </div>
          <div class="audio-tag">
            <span class="material-symbols-outlined" style="font-size:0.9rem;">graphic_eq</span>
            ${meta.audio}
          </div>
        </div>
        <div class="card-content">
          <div class="ai-pill">Gemini Optimized</div>
          <h3 class="video-title">${meta.title}</h3>
          <p class="video-desc">${meta.desc}</p>
          <p class="hashtags">${meta.tags}</p>
        </div>
      `;

      const thumbWrapper = card.querySelector('.thumbnail-wrapper');
      thumbWrapper.prepend(canvas);

      card.addEventListener('click', () => {
        openPreviewModal(videoSrc, meta);
      });

      galleryGrid.prepend(card);
    }

    function openPreviewModal(src, meta) {
      modalVideoPlayer.src = src;
      modalTitle.textContent = meta.title;
      modalDesc.textContent = meta.desc;
      modalTags.textContent = meta.tags;
      modalOverlay.classList.add('active');
    }

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      modalVideoPlayer.pause();
      modalVideoPlayer.src = '';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        modalVideoPlayer.pause();
        modalVideoPlayer.src = '';
      }
    });
  </script>
</body>
</html>
