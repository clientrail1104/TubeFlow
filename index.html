<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Video Queue & AI Publisher</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1e2029;
      --accent-gradient: linear-gradient(135deg, #4285f4, #9b51e0, #d9657b);
      --text-main: #e3e3e3;
      --text-sub: #9aa0a6;
      --border-color: #2d313e;
      --chip-bg: #282a36;
      --badge-scheduled: #1a382b;
      --badge-scheduled-text: #5bbd8c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gemini-spark {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: 50%;
      filter: blur(2px);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      background-color: rgba(30, 32, 41, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 32px;
    }

    .upload-zone:hover {
      border-color: #4285f4;
      background-color: rgba(66, 133, 244, 0.05);
    }

    .upload-zone input { display: none; }

    .btn {
      background: var(--accent-gradient);
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 180px 1fr 240px;
      gap: 20px;
      align-items: start;
    }

    .thumb-preview {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      background: #000;
      object-fit: cover;
    }

    .video-details h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .video-details p {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--chip-bg);
      color: #8ab4f8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .schedule-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .slot-badge {
      display: inline-block;
      background: var(--badge-scheduled);
      color: var(--badge-scheduled-text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .music-chip {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-btn {
      background: #2d313e;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .preview-btn:hover { background: #3c4043; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="gemini-spark"></div>
      <h1>Gemini Queue & Auto-Publisher</h1>
    </div>
    <div style="color: var(--text-sub); font-size: 0.9rem;">FIFO Slot Automation (11:00 AM & 8:00 PM)</div>
  </header>

  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4285f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p style="margin-top: 12px; font-weight: 500;">Drop multiple video files here or click to browse</p>
    <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 4px;">Supports MP4, MOV, WebM</p>
    <button class="btn" type="button">Select Videos</button>
    <input type="file" id="fileInput" multiple accept="video/*" onchange="handleFiles(this.files)" />
  </div>

  <div class="queue-header">
    <h2>Publishing Queue (<span id="queueCount">0</span>)</h2>
  </div>

  <div class="video-grid" id="videoGrid"></div>

  <script>
    // Royalty-Free Music Library mock database
    const trendingAudioTracks = [
      "Lofi Beats - Royalty Free (Viral Chill Vibes)",
      "Phonk Drift - No Copyright Music (Trending)",
      "Synthwave Glow - Creative Commons (Upbeat)",
      "Acoustic Pop - Commercial License Allowed"
    ];

    let queue = [];

    // Slot Calculation Engine (FIFO 11:00 AM & 8:00 PM)
    function calculateNextSlot(index) {
      const now = new Date();
      let slotTimes = [];

      // Generate publishing slots starting from today
      let currentDay = new Date(now);
      
      for (let i = 0; i < Math.max(index + 5, 10); i++) {
        const morningSlot = new Date(currentDay);
        morningSlot.setHours(11, 0, 0, 0);

        const eveningSlot = new Date(currentDay);
        eveningSlot.setHours(20, 0, 0, 0);

        if (morningSlot > now) slotTimes.push(morningSlot);
        if (eveningSlot > now) slotTimes.push(eveningSlot);

        currentDay.setDate(currentDay.getDate() + 1);
      }

      const targetDate = slotTimes[index];
      return targetDate.toLocaleString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric', 
        hour: 'numeric', 
        minute: '2-digit', 
        hour12: true 
      });
    }

    // AI Viral Content Generator Simulator
    function generateAIContent(filename, index) {
      const viralTitles = [
        "You Won't Believe What Happens Next! 🚀 #Viral",
        "The Secret Trick Nobody is Talking About 🔥",
        "100% Worth Watching Till The End ✨ #Trending",
        "This Completely Changed My Mind 🤯"
      ];

      const viralDescriptions = [
        "Unlocking the ultimate workflow trick that algorithm prioritizes today. Make sure to save this video for later!",
        "Watch step-by-step as we explore this viral trend. Comment your thoughts below!",
        "Sharing the exact strategy everyone has been searching for. Royalty-free audio included."
      ];

      const hashtags = [["#Viral", "#Trending", "#FYP"], ["#Shorts", "#Reels", "#TechTrends"], ["#LifeHack", "#MustWatch", "#Creator"]];

      return {
        title: viralTitles[index % viralTitles.length],
        description: viralDescriptions[index % viralDescriptions.length],
        hashtags: hashtags[index % hashtags.length],
        music: trendingAudioTracks[index % trendingAudioTracks.length]
      };
    }

    // Capture precise frame thumbnail (0.1s frame capture)
    function generateThumbnail(file, callback) {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.src = URL.createObjectURL(file);
      video.currentTime = 0.1; // Grab frame at 0.1s

      video.onseeked = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg'), video.src);
      };
    }

    function handleFiles(files) {
      const fileList = Array.from(files);
      
      fileList.forEach((file) => {
        generateThumbnail(file, (thumbUrl, videoUrl) => {
          const queueIndex = queue.length;
          const aiMeta = generateAIContent(file.name, queueIndex);
          const scheduledSlot = calculateNextSlot(queueIndex);

          const item = {
            id: Date.now() + Math.random(),
            filename: file.name,
            thumb: thumbUrl,
            videoUrl: videoUrl,
            ai: aiMeta,
            slot: scheduledSlot
          };

          queue.push(item);
          renderQueue();
        });
      });
    }

    function renderQueue() {
      const grid = document.getElementById('videoGrid');
      document.getElementById('queueCount').innerText = queue.length;
      grid.innerHTML = '';

      queue.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div>
            <img class="thumb-preview" src="${item.thumb}" alt="0.1s Thumbnail" />
            <button class="preview-btn" onclick="openPreview('${item.videoUrl}')">▶ Play Preview</button>
          </div>

          <div class="video-details">
            <h3>${item.ai.title}</h3>
            <p>${item.ai.description}</p>
            <div class="tags">
              ${item.ai.hashtags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
          </div>

          <div class="schedule-panel">
            <div>
              <span style="font-size:0.75rem; color: var(--text-sub);">Scheduled Slot (FIFO)</span>
              <div class="slot-badge">${item.slot}</div>
            </div>
            <div class="music-chip">
              🎵 ${item.ai.music}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPreview(url) {
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
