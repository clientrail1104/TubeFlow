<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Video Queue & YouTube Auto-Publisher</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1e2029;
      --accent-gradient: linear-gradient(135deg, #4285f4, #9b51e0, #d9657b);
      --text-main: #e3e3e3;
      --text-sub: #9aa0a6;
      --border-color: #2d313e;
      --chip-bg: #282a36;
      --badge-scheduled: #1a382b;
      --badge-scheduled-text: #5bbd8c;
      --badge-published: #10304a;
      --badge-published-text: #66b2ff;
      --badge-draft: #3a2e10;
      --badge-draft-text: #f5c518;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .gemini-spark {
      width: 28px; height: 28px;
      background: var(--accent-gradient);
      border-radius: 50%;
      filter: blur(2px);
    }

    h1 {
      font-size: 1.5rem; font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* YouTube Integration Header Bar */
    .yt-status-bar {
      background: rgba(255, 0, 0, 0.08);
      border: 1px solid rgba(255, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .yt-channel-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .yt-dot { width: 10px; height: 10px; border-radius: 50%; background: #00e676; }
    .yt-dot.disconnected { background: #ff5252; }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      background-color: rgba(30, 32, 41, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 32px;
    }

    .upload-zone:hover {
      border-color: #4285f4;
      background-color: rgba(66, 133, 244, 0.05);
    }

    .upload-zone input { display: none; }

    .btn {
      background: var(--accent-gradient);
      color: white; padding: 8px 20px;
      border: none; border-radius: 20px;
      font-weight: 500; cursor: pointer;
      margin-top: 12px;
    }

    .video-grid { display: flex; flex-direction: column; gap: 16px; }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px;
      display: grid;
      grid-template-columns: 180px 1fr 260px;
      gap: 20px; align-items: start;
    }

    .thumb-preview {
      width: 100%; height: 110px;
      border-radius: 12px; background: #000;
      object-fit: cover;
    }

    .video-details h3 { font-size: 1.05rem; margin-bottom: 6px; color: #fff; }
    .video-details p { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.4; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: var(--chip-bg); color: #8ab4f8; font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; }

    .schedule-panel {
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(0, 0, 0, 0.2); padding: 12px;
      border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-badge {
      display: inline-block; padding: 4px 10px;
      border-radius: 6px; font-size: 0.8rem; font-weight: 600;
    }
    .status-badge.scheduled { background: var(--badge-scheduled); color: var(--badge-scheduled-text); }
    .status-badge.published { background: var(--badge-published); color: var(--badge-published-text); }
    .status-badge.draft { background: var(--badge-draft); color: var(--badge-draft-text); }

    .preview-btn {
      background: #2d313e; color: #fff; border: none;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; margin-top: 8px; width: 100%;
    }
    .preview-btn:hover { background: #3c4043; }

    /* IN-PAGE PREVIEW MODAL STYLES */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 20px; width: 90%; max-width: 800px;
      padding: 24px; position: relative; max-height: 90vh; overflow-y: auto;
    }

    .modal-close {
      position: absolute; top: 16px; right: 20px;
      background: transparent; border: none; color: var(--text-sub);
      font-size: 1.8rem; cursor: pointer;
    }
    .modal-close:hover { color: #fff; }

    .modal-video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="gemini-spark"></div>
      <h1>Gemini Queue & Auto-Publisher</h1>
    </div>
    <div style="color: var(--text-sub); font-size: 0.85rem;">FIFO Slots: 11:00 AM & 8:00 PM Daily</div>
  </header>

  <!-- YouTube Channel Status Section -->
  <div class="yt-status-bar">
    <div class="yt-channel-info">
      <div class="yt-dot" id="ytDot"></div>
      <div>
        <strong id="ytChannelName">Connected Channel: Creator Studio Account</strong>
        <div style="font-size: 0.75rem; color: var(--text-sub);" id="ytSyncStatus">Auto-Syncing with YouTube Data API v3</div>
      </div>
    </div>
    <button class="preview-btn" style="width: auto; padding: 6px 16px;" onclick="simulatePublishing()">Simulate Auto-Publishing</button>
  </div>

  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4285f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p style="margin-top: 8px; font-weight: 500;">Drop video files here or click to browse</p>
    <button class="btn" type="button">Upload Video Queue</button>
    <input type="file" id="fileInput" multiple accept="video/*" onchange="handleFiles(this.files)" />
  </div>

  <h2>Publishing Queue (<span id="queueCount">0</span>)</h2>
  <div class="video-grid" id="videoGrid" style="margin-top: 16px;"></div>

  <!-- IN-PAGE PREVIEW MODAL -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" style="color: #fff;">Video Preview</h2>
      <video id="modalVideoPlayer" class="modal-video" controls autoplay></video>
      <div style="margin-top: 16px;">
        <div style="display: flex; gap: 8px; margin-bottom: 8px;" id="modalTags"></div>
        <p id="modalDesc" style="color: var(--text-sub); font-size: 0.9rem; line-height: 1.5;"></p>
        <div style="margin-top: 12px; font-size: 0.85rem; color: #8ab4f8;" id="modalMusic"></div>
      </div>
    </div>
  </div>

  <script>
    const trendingAudioTracks = [
      "Lofi Beats - Royalty Free (Viral Chill Vibes)",
      "Phonk Drift - No Copyright Music (Trending)",
      "Synthwave Glow - Creative Commons (Upbeat)",
      "Acoustic Pop - Commercial License Allowed"
    ];

    let queue = [];

    // Calculate FIFO slots (11:00 AM & 8:00 PM)
    function calculateNextSlot(index) {
      const now = new Date();
      let slotTimes = [];
      let currentDay = new Date(now);
      
      for (let i = 0; i < Math.max(index + 5, 10); i++) {
        const morningSlot = new Date(currentDay); morningSlot.setHours(11, 0, 0, 0);
        const eveningSlot = new Date(currentDay); eveningSlot.setHours(20, 0, 0, 0);

        if (morningSlot > now) slotTimes.push(morningSlot);
        if (eveningSlot > now) slotTimes.push(eveningSlot);
        currentDay.setDate(currentDay.getDate() + 1);
      }

      return slotTimes[index].toLocaleString('en-US', { 
        weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true 
      });
    }

    function generateAIContent(filename, index) {
      const titles = [
        "You Won't Believe What Happens Next! 🚀 #Viral",
        "The Secret Trick Nobody is Talking About 🔥",
        "100% Worth Watching Till The End ✨ #Trending",
        "This Completely Changed My Mind 🤯"
      ];
      const descriptions = [
        "Unlocking the ultimate workflow trick that the algorithm prioritizes today.",
        "Watch step-by-step as we explore this viral trend. Comment your thoughts below!",
        "Sharing the exact strategy everyone has been searching for."
      ];
      const tags = [["#Viral", "#Trending"], ["#Shorts", "#Reels"], ["#LifeHack", "#MustWatch"]];

      return {
        title: titles[index % titles.length],
        description: descriptions[index % descriptions.length],
        hashtags: tags[index % tags.length],
        music: trendingAudioTracks[index % trendingAudioTracks.length]
      };
    }

    // Capture 0.1s exact frame
    function generateThumbnail(file, callback) {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.src = URL.createObjectURL(file);
      video.currentTime = 0.1;

      video.onseeked = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 180;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg'), video.src);
      };
    }

    function handleFiles(files) {
      Array.from(files).forEach((file) => {
        generateThumbnail(file, (thumbUrl, videoUrl) => {
          const queueIndex = queue.length;
          queue.push({
            id: Date.now() + Math.random(),
            filename: file.name,
            thumb: thumbUrl,
            videoUrl: videoUrl,
            ai: generateAIContent(file.name, queueIndex),
            slot: calculateNextSlot(queueIndex),
            status: 'Scheduled', // Statuses: Scheduled -> Publishing -> Live
            ytVideoId: null
          });
          renderQueue();
        });
      });
    }

    function renderQueue() {
      const grid = document.getElementById('videoGrid');
      document.getElementById('queueCount').innerText = queue.length;
      grid.innerHTML = '';

      queue.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        
        let statusBadgeClass = item.status === 'Live' ? 'published' : 'scheduled';
        let ytStatusHTML = item.status === 'Live' 
          ? `<a href="https://youtube.com" target="_blank" style="color:#66b2ff; font-size:0.75rem;">✔ Live on Channel (ID: ${item.ytVideoId})</a>`
          : `<span style="font-size:0.75rem; color:var(--text-sub);">Scheduled for YouTube</span>`;

        card.innerHTML = `
          <div>
            <img class="thumb-preview" src="${item.thumb}" />
            <button class="preview-btn" onclick="openModal(${index})">▶ In-Page Preview</button>
          </div>
          <div class="video-details">
            <h3>${item.ai.title}</h3>
            <p>${item.ai.description}</p>
            <div class="tags">
              ${item.ai.hashtags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
          <div class="schedule-panel">
            <div>
              <span class="status-badge ${statusBadgeClass}">${item.status}</span>
              <div style="font-size:0.85rem; margin-top:6px; font-weight:600; color:#fff;">${item.slot}</div>
            </div>
            ${ytStatusHTML}
            <div style="font-size:0.75rem; color:var(--text-sub);">🎵 ${item.ai.music}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal Control Functions (In-Page Preview)
    function openModal(index) {
      const item = queue[index];
      document.getElementById('modalTitle').innerText = item.ai.title;
      document.getElementById('modalDesc').innerText = item.ai.description;
      document.getElementById('modalMusic').innerText = "🎵 Audio: " + item.ai.music;
      
      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = item.ai.hashtags.map(t => `<span class="tag">${t}</span>`).join('');

      const player = document.getElementById('modalVideoPlayer');
      player.src = item.videoUrl;
      
      document.getElementById('previewModal').style.display = 'flex';
    }

    function closeModal() {
      const player = document.getElementById('modalVideoPlayer');
      player.pause();
      player.src = '';
      document.getElementById('previewModal').style.display = 'none';
    }

    // Simulation of automated scheduled posting status update
    function simulatePublishing() {
      const pendingItem = queue.find(i => i.status === 'Scheduled');
      if (pendingItem) {
        pendingItem.status = 'Live';
        pendingItem.ytVideoId = 'yt_' + Math.random().toString(36).substr(2, 7);
        renderQueue();
      } else {
        alert("No scheduled videos left in queue to publish!");
      }
    }
  </script>
</body>
</html>
